# Example UID allocation: audit existing passwd/group state before applying.
# No account receives sudo, docker, systemd-journal or another role's group.
g ccrelay-clients 23200
g ccrelay-owner-ingress 23201
u relay 23000 "Telegram router" /var/lib/ccrelay-components/relay /usr/sbin/nologin
u ccrelay-broker 23001 "Authenticated broker" /var/lib/ccrelay-broker /usr/sbin/nologin
u ccrelay-publisher 23002 "GitHub publisher" /var/lib/ccrelay-components/publisher /usr/sbin/nologin
u ccrelay-backup 23003 "Encrypted recovery" /var/lib/ccrelay-components/backup /usr/sbin/nologin
u ccrelay-memory 23004 "Canonical memory service" /var/lib/ccrelay-components/memory /usr/sbin/nologin
u ccrelay-deployer 23005 "Protected deploy coordinator" /var/lib/ccrelay-components/deployer /usr/sbin/nologin
u ccrelay-builder 23100 "Builder" /var/lib/ccrelay/roles/builder /usr/sbin/nologin
u ccrelay-reviewer 23101 "Reviewer" /var/lib/ccrelay/roles/reviewer /usr/sbin/nologin
u ccrelay-cto 23102 "On-demand CTO" /var/lib/ccrelay/roles/cto /usr/sbin/nologin
u ccrelay-support 23103 "Support" /var/lib/ccrelay/roles/support /usr/sbin/nologin
u ccrelay-ceo 23104 "On-demand CEO" /var/lib/ccrelay/roles/ceo /usr/sbin/nologin
m ccrelay-broker ccrelay-clients
m ccrelay-builder ccrelay-clients
m ccrelay-reviewer ccrelay-clients
m ccrelay-cto ccrelay-clients
m ccrelay-support ccrelay-clients
m ccrelay-ceo ccrelay-clients
m relay ccrelay-owner-ingress
m ccrelay-deployer ccrelay-owner-ingress
